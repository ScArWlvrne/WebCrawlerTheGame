elements:
  - id: redCube
    type: cube
    position: [-6, 1, 0]
    size: [2, 2, 2]
    rotation: [0, 45, 0]
    color: "#FF4444"

  - id: iconPanel
    type: panel
    position: [-2, 1, 0]
    size: [3, 2, 1]
    rotation: [0, 0, 0]
    texture: icon
    color: "#FFFFFF"

  - id: blueSphere
    type: sphere
    position: [2, 1, 0]
    size: [2, 2, 2]
    rotation: [0, 0, 0]
    color: "#4488FF"

  - id: yellowCapsule
    type: capsule
    position: [6, 1.5, 0]
    size: [1.5, 3, 1.5]
    rotation: [0, 0, 0]
    color: "#FFFF44"

  - id: purpleCylinder
    type: cylinder
    position: [10, 1, 0]
    size: [2, 2, 2]
    rotation: [0, 0, 0]
    color: "#AA44FF"

  - id: textElement
    type: text
    position: [0, 3, 0]
    size: [1, 1, 1]
    rotation: [0, 0, 0]
    color: "#FFFFFF"
    text: "Hello World!"
    font: "LiberationSans SDF"
    fontSize: 36

