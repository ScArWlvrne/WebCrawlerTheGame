              - id: icon
                type: panel
                position: [-1.6, -0.2, -0.02]
                rotation: [0, 0, 0]
                size: [1, 1, 1]
                texture: icon

              - id: cube
                type: cube
                position: [1.5, -0.2, -0.5]
