          fontSize: 12
          color: "#000000"

        - id: icon
          type: panel
          position: [-1.6, -0.2, -0.02]
          rotation: [0, 0, 0]
          size: [1, 1, 1]
          texture: icon

        - id: cube
          type: cube
          position: [1.5, -0.2, -0.5]
          rotation: [30, 45, 0]
          size: [0.75, 0.75, 0.75]
          color: "#FF8800"

        - id: testContainer2
          type: container
          position: [0, -5, 0]
          rotation: [0, 0, 0]
          size: [1, 1, 1]
          elements:
            elements:
              - id: background
                type: panel
